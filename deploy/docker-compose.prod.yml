# Production stack for the Hostinger VPS: the always-on API (migrates on boot, runs the dispatch/
# refund/settlement sweep loops) behind Caddy for automatic HTTPS. PostgreSQL is NOT in this file —
# in production it lives in Google Cloud SQL (managed backups + PITR). See deploy/cloudsql-setup.md.
#
#   1. Put real secrets in deploy/.env.prod  (copy from ../.env.production.example; NEVER commit it).
#   2. docker compose -f deploy/docker-compose.prod.yml up -d --build
#   3. docker compose -f deploy/docker-compose.prod.yml exec api \
#        npm run bootstrap-admin -w @tunakula/api -- +243810000000 "Launch Owner"
#
# The API binds to 127.0.0.1:8080 on the host; only Caddy is exposed to the internet (80/443).
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: "8080"
      # Behind Caddy: trust X-Forwarded-* and enable the per-instance rate limit as a second layer.
      TUNAKULA_TRUST_PROXY: "1"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
