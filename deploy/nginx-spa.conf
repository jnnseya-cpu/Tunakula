# Serve a Next.js static export (output: "export", trailingSlash: true). Files are directory-style
# (/order/index.html), so try the path, then its directory index, then the matching .html, then the root.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Long-cache the hashed build assets; never cache the HTML shells.
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/index.html $uri.html $uri/ /index.html;
  }

  # Basic hardening headers (the app's own CSP/security is served by the API; these are static-host defaults).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
