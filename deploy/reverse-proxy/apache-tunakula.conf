# Tunakula behind an existing Apache — reverse-proxy the three subdomains to the local coexist containers.
#
# 1. Enable the proxy modules once:   sudo a2enmod proxy proxy_http headers ssl
# 2. Replace yourdomain.com / api. / admin. with your real names (match deploy/.env.staging).
# 3. Debian/Ubuntu: save as /etc/apache2/sites-available/tunakula.conf then
#        sudo a2ensite tunakula && sudo apache2ctl configtest && sudo systemctl reload apache2
#    RHEL-family: save as /etc/httpd/conf.d/tunakula.conf then  sudo apachectl configtest && sudo systemctl reload httpd
# 4. Add HTTPS (edits these vhosts in place, leaves your other sites untouched):
#        sudo certbot --apache -d yourdomain.com -d admin.yourdomain.com -d api.yourdomain.com
#
# ProxyPreserveHost passes the real Host; certbot adds the X-Forwarded-Proto=https on the :443 vhosts it writes.

# Customer storefront  ->  127.0.0.1:8091
<VirtualHost *:80>
    ServerName yourdomain.com
    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8091/
    ProxyPassReverse /  http://127.0.0.1:8091/
    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>

# Admin console  ->  127.0.0.1:8092
<VirtualHost *:80>
    ServerName admin.yourdomain.com
    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8092/
    ProxyPassReverse /  http://127.0.0.1:8092/
    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>

# API  ->  127.0.0.1:8090
<VirtualHost *:80>
    ServerName api.yourdomain.com
    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8090/
    ProxyPassReverse /  http://127.0.0.1:8090/
    RequestHeader set X-Forwarded-Proto "http"
    ProxyTimeout 300
</VirtualHost>
