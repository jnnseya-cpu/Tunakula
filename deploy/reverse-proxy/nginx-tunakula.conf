# Tunakula behind an existing Nginx — reverse-proxy the three subdomains to the local coexist containers.
#
# 1. Replace yourdomain.com / api. / admin. with your real names (keep them matching deploy/.env.staging).
# 2. Save as /etc/nginx/sites-available/tunakula.conf
#        sudo ln -s /etc/nginx/sites-available/tunakula.conf /etc/nginx/sites-enabled/
#    (on RHEL-family Nginx there are no sites-* dirs — put it in /etc/nginx/conf.d/tunakula.conf instead)
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. Add HTTPS (edits these blocks in place, keeps your other sites untouched):
#        sudo certbot --nginx -d yourdomain.com -d admin.yourdomain.com -d api.yourdomain.com
#
# These blocks listen only on :80 for the three Tunakula names; your existing server blocks are not touched.

# Customer storefront  ->  127.0.0.1:8091
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;
    client_max_body_size 12m;   # ID/menu photo uploads
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin console  ->  127.0.0.1:8092
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API  ->  127.0.0.1:8090   (buffering off so server-sent updates stream through)
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
