# Continuous deployment of the WEB platform (API + customer site + admin console) to the VPS.
#
# Every push to the deploy branch (and main) is fully gated by `npm run check` (guards, typecheck, all
# tests, both web builds); only if that passes does it SSH to the VPS, pull the same commit, and bring the
# coexist stack up with the new code. So the web is always deployed at the end of a green build.
#
# ONE-TIME setup on the VPS (run the interactive bring-up once, which writes deploy/.env.staging and wires
# Caddy): `bash deploy/go-live-coexist.sh`. After that, this workflow handles every subsequent deploy.
#
# Repository SECRETS this needs (Settings → Secrets and variables → Actions):
#   VPS_HOST       the server's hostname or IP
#   VPS_USER       the SSH user (e.g. root)
#   VPS_SSH_KEY    a private SSH key authorized on the server
#   VPS_PORT       (optional) SSH port, defaults to 22
# Repository VARIABLES (optional):
#   VPS_APP_DIR    the repo checkout on the server, defaults to /root/Tunakula
name: Deploy web

on:
  push:
    branches: [main, claude/exciting-turing-k5r4jb]
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Build + test gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guards, typecheck, tests, web builds
        run: npm run check

  deploy:
    name: Deploy to VPS
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scope the VPS secrets to a protected environment if you like (Settings → Environments → production).
    environment: production
    steps:
      - name: SSH deploy (pull + coexist stack up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_REF,APP_DIR
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/root/Tunakula}"
            cd "$APP_DIR"
            git fetch --all --prune
            git checkout "$DEPLOY_REF"
            git reset --hard "origin/$DEPLOY_REF"
            C="docker compose --env-file deploy/.env.staging -f deploy/docker-compose.coexist.yml"
            $C up -d --build
            # wait for the API to report healthy, else fail the deploy
            for i in $(seq 1 60); do
              if $C exec -T api node -e "fetch('http://127.0.0.1:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "API healthy"; break
              fi
              [ "$i" -eq 60 ] && { echo "API did not become healthy"; $C logs --tail=80 api; exit 1; }
              sleep 3
            done
            $C ps
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
