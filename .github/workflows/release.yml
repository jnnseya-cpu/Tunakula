# Build and publish the three deployable images on a version tag (e.g. `git tag v1.0.0 && git push --tags`):
# the API, and the two static web frontends. Tests/guards/CodeQL run separately in ci.yml on every push/PR;
# tag a commit that is already green. The frontends bake NEXT_PUBLIC_API_URL at build time, so set it per
# environment via repository variables (vars.CUSTOMER_API_URL / vars.ADMIN_API_URL).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tunakula-api
            dockerfile: Dockerfile
            build_args: ""
          - name: tunakula-web-customer
            dockerfile: frontend/customer/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=${{ vars.CUSTOMER_API_URL }}
          - name: tunakula-web-admin
            dockerfile: frontend/admin/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=${{ vars.ADMIN_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
